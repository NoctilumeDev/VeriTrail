[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "veritrail"
version = "0.12.2"
description = "Local-first evidence workbench for controlled software acceptance"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "NoctilumeDev" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright==1.62.0"]
command-windows = ["pywin32==312; sys_platform == 'win32'"]

[project.scripts]
veritrail = "veritrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
