name: Reproducible defect
description: Report behavior that contradicts a declared VeriTrail contract or executable fact.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve VeriTrail. Report one reproducible defect per issue.
        Do not include secrets, personal data, exploit payloads, or unredacted evidence artifacts. Follow the [Security Policy](https://github.com/NoctilumeDev/VeriTrail/security/policy) for vulnerabilities.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Core
        - Starter
        - Authoring Skill
        - Workbench
        - CI, packaging, or release assets
        - Documentation or public metadata
        - Unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use an immutable tag, release, or full commit SHA when possible.
      placeholder: v0.12.0 or 40-character commit SHA
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: State what happened without interpreting missing evidence as success.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected contract or behavior
      description: Link the README, contract, test, schema, or release claim that is contradicted.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands, bounded inputs, and the earliest failing step.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and boundaries
      description: Include OS, Python/Node/browser versions, preset, resource limits, and relevant local-only topology. Redact sensitive values.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add the smallest safe log excerpt, assertion, screenshot, or artifact identity needed to verify the failure.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and found no matching report.
          required: true
        - label: This report contains no secret, personal data, exploit payload, or unredacted evidence artifact.
          required: true
        - label: I have not treated a Planned, Prototype, or explicitly unsupported capability as a defect.
          required: true
