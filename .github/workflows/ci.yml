name: Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            starter/pyproject.toml
            plugins/github-evidence/pyproject.toml

      - name: Install the Core test capabilities
        run: python -m pip install --editable ".[browser,command-windows]"

      - name: Install the independent Starter entry layer
        run: python -m pip install --editable ./starter

      - name: Install the independent GitHub Evidence plugin
        run: python -m pip install --editable ./plugins/github-evidence

      - name: Install the frozen Chromium engine
        run: python -m playwright install chromium

      - name: Run Core regression tests
        run: python -m unittest -v

      - name: Run Core regression tests with assertions disabled
        run: python -O -m unittest -v

      - name: Run Starter contract tests
        run: python -m unittest discover -s starter/tests -v

      - name: Run Starter contract tests with assertions disabled
        run: python -O -m unittest discover -s starter/tests -v

      - name: Run Authoring Skill contract tests
        run: python -m unittest discover -s skills/veritrail-authoring/tests -v

      - name: Run Authoring Skill contract tests with assertions disabled
        run: python -O -m unittest discover -s skills/veritrail-authoring/tests -v

      - name: Run GitHub Evidence plugin contract tests
        run: python -m unittest discover -s plugins/github-evidence/tests -v

      - name: Run GitHub Evidence plugin contract tests with assertions disabled
        run: python -O -m unittest discover -s plugins/github-evidence/tests -v

      - name: Run the real Authoring Skill DRAFT chain
        run: python scripts/authoring_skill_acceptance.py

      - name: Run the static-site Authoring Skill DRAFT chain
        run: python scripts/authoring_skill_acceptance.py --preset static-site

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Upload the Core wheel for checkout-free acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-wheel-${{ matrix.python-version }}
          path: dist/veritrail-*.whl
          if-no-files-found: error
          retention-days: 1

      - name: Build the independent GitHub Evidence plugin wheel
        run: python -m pip wheel --no-deps --wheel-dir dist ./plugins/github-evidence

      - name: Upload the GitHub Evidence plugin wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-evidence-wheel-${{ matrix.python-version }}
          path: dist/veritrail_github_evidence-*.whl
          if-no-files-found: error
          retention-days: 1

      - name: Build the independent Starter wheel
        run: python -m pip wheel --no-deps --wheel-dir dist ./starter

      - name: Build the independent Starter source distribution
        working-directory: starter
        run: |
          python -m pip install "setuptools==80.9.0"
          python -c "from setuptools import build_meta; print(build_meta.build_sdist('../dist'))"

      - name: Download and verify the frozen Core release wheel
        shell: pwsh
        run: |
          $coreWheel = Join-Path '${{ runner.temp }}' 'veritrail-0.12.0-py3-none-any.whl'
          curl.exe --fail --location --retry 3 --output $coreWheel `
            'https://github.com/NoctilumeDev/VeriTrail/releases/download/v0.12.0/veritrail-0.12.0-py3-none-any.whl'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = 'd0293f06e6a2b0271870ce032b2197c6ef7956db0ff3889230ca48234ff2fa45'
          $observed = (Get-FileHash -Algorithm SHA256 -LiteralPath $coreWheel).Hash.ToLowerInvariant()
          if ($observed -ne $expected) { throw "Core release wheel digest drifted: $observed" }
          "VERITRAIL_CORE_WHEEL=$coreWheel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download the frozen E1 entry-layer release assets
        shell: pwsh
        run: |
          $assetRoot = Join-Path '${{ runner.temp }}' 'entry-layer-e1-assets'
          New-Item -ItemType Directory -Path $assetRoot | Out-Null
          $assets = @(
            @('starter-v0.1.0', 'veritrail_starter-0.1.0-py3-none-any.whl'),
            @('starter-v0.1.0', 'veritrail_starter-0.1.0.tar.gz'),
            @('starter-v0.1.0', 'starter-e1-validation-summary.json'),
            @('starter-v0.1.0', 'SHA256SUMS-starter.txt'),
            @('authoring-skill-v0.1.0', 'veritrail-authoring-0.1.0.zip'),
            @('authoring-skill-v0.1.0', 'authoring-skill-e1-validation-summary.json'),
            @('authoring-skill-v0.1.0', 'SHA256SUMS-authoring-skill.txt')
          )
          foreach ($asset in $assets) {
            $tag = $asset[0]
            $name = $asset[1]
            $url = "https://github.com/NoctilumeDev/VeriTrail/releases/download/$tag/$name"
            curl.exe --fail --location --retry 3 --output (Join-Path $assetRoot $name) $url
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "VERITRAIL_E1_ASSETS=$assetRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run E1 release clean-install acceptance
        run: >-
          python scripts/entry_layer_e1_acceptance.py
          --output "${{ runner.temp }}\entry-layer-e1-${{ matrix.python-version }}"
          --python "${{ env.pythonLocation }}\python.exe"
          --core-wheel "${{ env.VERITRAIL_CORE_WHEEL }}"
          --from-assets "${{ env.VERITRAIL_E1_ASSETS }}"

  wheel-only-first-run:
    name: Wheel-only first run on Python ${{ matrix.python-version }}
    needs: [python]
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download only the built Core wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: core-wheel-${{ matrix.python-version }}
          path: ${{ runner.temp }}/core-wheel

      - name: Prove the workspace has no repository checkout
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.git')) {
            throw 'wheel-only acceptance unexpectedly contains a Git checkout'
          }
          $entries = @(Get-ChildItem -Force -LiteralPath $env:GITHUB_WORKSPACE)
          if ($entries.Count -ne 0) {
            throw "wheel-only workspace is not empty: $($entries.Name -join ', ')"
          }

      - name: Install only the wheel and run the self-contained demo
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -File -LiteralPath '${{ runner.temp }}/core-wheel' -Filter 'veritrail-*.whl')
          if ($wheel.Count -ne 1) { throw "expected one Core wheel, found $($wheel.Count)" }
          python -m pip install --no-deps $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $output = Join-Path '${{ runner.temp }}' 'veritrail-wheel-only-demo'
          veritrail demo --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $summary = Get-Content -Raw -LiteralPath (Join-Path $output 'demo-summary.json') | ConvertFrom-Json
          if ($summary.runs.pass.verdict -ne 'PASS') { throw 'built-in positive demo did not PASS' }
          if ($summary.runs.fail.verdict -ne 'FAIL') { throw 'built-in negative demo did not FAIL' }
          if ($summary.catalog.run_count -ne 2 -or $summary.catalog.issue_count -ne 0) {
            throw 'built-in demo Catalog is incomplete'
          }
          if ($summary.boundary -ne 'SYNTHETIC_CORE_DEMO_NOT_PROJECT_ACCEPTANCE') {
            throw 'built-in demo boundary marker drifted'
          }

          $pass = Get-Content -Raw -LiteralPath (Join-Path $output 'artifacts/demo-pass/report.json') | ConvertFrom-Json
          $fail = Get-Content -Raw -LiteralPath (Join-Path $output 'artifacts/demo-fail/report.json') | ConvertFrom-Json
          if ($pass.plan.sha256 -ne $fail.plan.sha256) { throw 'demo Runs do not share one sealed Plan' }

          $textFiles = @(Get-ChildItem -File -Recurse -LiteralPath $output | Where-Object {
            $_.Extension -in @('.json', '.md')
          })
          $leaks = @($textFiles | Select-String -SimpleMatch -Pattern $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE)
          if ($leaks.Count -ne 0) { throw 'demo persisted a runner-local absolute path' }

          $webRoot = Join-Path '${{ runner.temp }}' 'veritrail-wheel-only-web-${{ matrix.python-version }}'
          New-Item -ItemType Directory -Path $webRoot -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $webRoot 'index.html') `
            -Value '<!doctype html><title>VeriTrail wheel-only acceptance</title>' `
            -Encoding utf8

          $listener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback,
            0
          )
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $origin = "http://127.0.0.1:$port"
          $stdout = Join-Path '${{ runner.temp }}' 'catalog-serve.stdout.log'
          $stderr = Join-Path '${{ runner.temp }}' 'catalog-serve.stderr.log'
          $command = (Get-Command veritrail -ErrorAction Stop).Source
          $service = Start-Process -FilePath $command -ArgumentList @(
            'catalog-serve',
            '--catalog', (Join-Path $output 'catalog'),
            '--artifacts', (Join-Path $output 'artifacts'),
            '--web-root', $webRoot,
            '--port', "$port"
          ) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              $service.Refresh()
              if ($service.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri "$origin/api/v1/health" -TimeoutSec 2
                if ($health.status -eq 'READY') { break }
              } catch {
                Start-Sleep -Milliseconds 100
              }
            }
            if ($null -eq $health -or $health.status -ne 'READY' -or -not $health.read_only) {
              if (Test-Path -LiteralPath $stdout) { Get-Content -Raw -LiteralPath $stdout | Write-Host }
              if (Test-Path -LiteralPath $stderr) { Get-Content -Raw -LiteralPath $stderr | Write-Host }
              throw 'wheel-only catalog-serve did not become READY'
            }

            $servedCatalog = Invoke-RestMethod -Uri "$origin/api/v1/catalog" -TimeoutSec 5
            if ($servedCatalog.catalog.run_count -ne 2 -or $servedCatalog.catalog.issue_count -ne 0) {
              throw 'wheel-only served Catalog is incomplete'
            }
            $passRun = @($servedCatalog.runs | Where-Object { $_.run_id -eq 'demo-pass' })
            if ($passRun.Count -ne 1) { throw 'wheel-only served Catalog lost demo-pass' }
            $servedReport = Invoke-RestMethod `
              -Uri ($origin + $passRun[0].bundle.base_url + 'report.json') `
              -TimeoutSec 5
            if ($servedReport.verdict -ne 'PASS') {
              throw 'wheel-only catalog-serve did not return the PASS Bundle report'
            }
          } finally {
            if ($null -ne $service) {
              $service.Refresh()
              if (-not $service.HasExited) {
                Stop-Process -Id $service.Id -Force
                $service.WaitForExit(5000) | Out-Null
              }
            }
          }

          $listeners = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)
          if ($listeners.Count -ne 0) { throw 'wheel-only catalog-serve left its port listening' }
          $sidecars = @(Get-ChildItem -File -LiteralPath (Join-Path $output 'catalog') -Filter 'catalog.sqlite3-*')
          if ($sidecars.Count -ne 0) { throw 'wheel-only catalog-serve left SQLite sidecars' }
          $staging = @(Get-ChildItem -Directory -Force -LiteralPath (Split-Path -Parent $output) | Where-Object {
            $_.Name -like '.veritrail-demo-*' -or $_.Name -like '.veritrail-catalog-*'
          })
          if ($staging.Count -ne 0) { throw 'wheel-only acceptance left staging directories' }

  github-evidence-wheel-only:
    name: GitHub Evidence wheel-only on Python ${{ matrix.python-version }}
    needs: [python]
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download only the built Core wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: core-wheel-${{ matrix.python-version }}
          path: ${{ runner.temp }}/github-evidence-core-wheel

      - name: Download only the built GitHub Evidence plugin wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: github-evidence-wheel-${{ matrix.python-version }}
          path: ${{ runner.temp }}/github-evidence-plugin-wheel

      - name: Prove the workspace has no repository checkout
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.git')) {
            throw 'wheel-only acceptance unexpectedly contains a Git checkout'
          }
          $entries = @(Get-ChildItem -Force -LiteralPath $env:GITHUB_WORKSPACE)
          if ($entries.Count -ne 0) {
            throw "wheel-only workspace is not empty: $($entries.Name -join ', ')"
          }

      - name: Install only wheels and verify the public plugin entry points
        shell: pwsh
        run: |
          $core = @(Get-ChildItem -File -LiteralPath '${{ runner.temp }}/github-evidence-core-wheel' -Filter 'veritrail-*.whl')
          $plugin = @(Get-ChildItem -File -LiteralPath '${{ runner.temp }}/github-evidence-plugin-wheel' -Filter 'veritrail_github_evidence-*.whl')
          if ($core.Count -ne 1) { throw "expected one Core wheel, found $($core.Count)" }
          if ($plugin.Count -ne 1) { throw "expected one plugin wheel, found $($plugin.Count)" }
          python -m pip install --no-deps $core[0].FullName $plugin[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -c "from veritrail.canonical import sha256_json; from veritrail_github import __version__; raise SystemExit(0 if __version__ == '0.1.0' and sha256_json({}) == '44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a' else 1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          veritrail-github-collect --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  acceptance-core-freeze:
    name: Acceptance Core freeze on Python ${{ matrix.python-version }}
    needs: [python]
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out only the PC2 verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the built Core wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: core-wheel-${{ matrix.python-version }}
          path: ${{ runner.temp }}/acceptance-core-wheel

      - name: Install only the built wheel
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -File -LiteralPath '${{ runner.temp }}/acceptance-core-wheel' -Filter 'veritrail-*.whl')
          if ($wheel.Count -ne 1) { throw "expected one Core wheel, found $($wheel.Count)" }
          python -m pip install --no-deps --force-reinstall $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate and independently recompute PASS and FAIL bundles
        shell: pwsh
        run: |
          $output = Join-Path '${{ runner.temp }}' 'pc2-acceptance-core-${{ matrix.python-version }}'
          python -I scripts/pc2_acceptance_core_freeze.py `
            --output $output `
            --expected-source-root '${{ github.workspace }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $summary = Get-Content -Raw -LiteralPath (Join-Path $output 'pc2-summary.json') | ConvertFrom-Json
          if ($summary.status -ne 'PASS') { throw 'PC2 summary did not PASS' }
          if ($summary.cases.pass.verdict -ne 'PASS' -or $summary.cases.fail.verdict -ne 'FAIL') {
            throw 'PC2 positive/negative verdicts drifted'
          }
          if ($summary.boundary -ne 'PC2_ACCEPTANCE_CORE_FREEZE_NOT_P1') {
            throw 'PC2/P1 boundary marker drifted'
          }

      - name: Upload failed PC2 evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pc2-acceptance-core-failure-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pc2-acceptance-core-${{ matrix.python-version }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  entry-layer-e3-release:
    name: E3 0.2 release download acceptance
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.10
        id: py310
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Set up Python 3.13
        id: py313
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install the frozen Chromium engine for Starter doctor
        run: |
          python -m pip install "playwright==1.62.0"
          python -m playwright install chromium

      - name: Download and verify the frozen Core and E3 release assets
        shell: pwsh
        run: |
          $coreWheel = Join-Path '${{ runner.temp }}' 'veritrail-0.12.0-py3-none-any.whl'
          curl.exe --fail --location --retry 3 --output $coreWheel `
            'https://github.com/NoctilumeDev/VeriTrail/releases/download/v0.12.0/veritrail-0.12.0-py3-none-any.whl'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $coreExpected = 'd0293f06e6a2b0271870ce032b2197c6ef7956db0ff3889230ca48234ff2fa45'
          $coreObserved = (Get-FileHash -Algorithm SHA256 -LiteralPath $coreWheel).Hash.ToLowerInvariant()
          if ($coreObserved -ne $coreExpected) { throw "Core release wheel digest drifted: $coreObserved" }

          $assetRoot = Join-Path '${{ runner.temp }}' 'entry-layer-e3-assets'
          New-Item -ItemType Directory -Path $assetRoot | Out-Null
          $assets = @(
            @('starter-v0.2.0', 'veritrail_starter-0.2.0-py3-none-any.whl', 'ce6e9ea0730adc891aba97f8148fdb861fffdd5164989c980b5cbbaaa950771f'),
            @('starter-v0.2.0', 'veritrail_starter-0.2.0.tar.gz', 'd86b836cad6f5b0bf2fbe17ce3d86fb309fa1fb1f2e592b757ef4b0f5f48188d'),
            @('starter-v0.2.0', 'starter-e3-validation-summary.json', '147ca81269b30eb93e56d4cd42526c9c9aedd26747643d724ad8aaf36c3ca979'),
            @('starter-v0.2.0', 'SHA256SUMS-starter.txt', '44ab7b1292e6170cad531bad906081b68848241cb36099b25a13f71a3b394791'),
            @('authoring-skill-v0.2.0', 'veritrail-authoring-0.2.0.zip', '591b064d4fb6f7e66083124939c1ffb21daa5a0f2e2c3b51267e738b203640b6'),
            @('authoring-skill-v0.2.0', 'authoring-skill-e3-validation-summary.json', 'a8cfc0c33fdb2520dbc26b0338acd5d5bb2afcfe5bf18a9b9bb01fcaedccb45a'),
            @('authoring-skill-v0.2.0', 'SHA256SUMS-authoring-skill.txt', 'e744512b3f8560f779a70c71ea6b5891554bb14ced6688ea865b2ad2a28a8456')
          )
          foreach ($asset in $assets) {
            $tag = $asset[0]
            $name = $asset[1]
            $expected = $asset[2]
            $target = Join-Path $assetRoot $name
            $url = "https://github.com/NoctilumeDev/VeriTrail/releases/download/$tag/$name"
            curl.exe --fail --location --retry 3 --output $target $url
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $observed = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
            if ($observed -ne $expected) { throw "$name digest drifted: $observed" }
          }
          "VERITRAIL_CORE_WHEEL_E3=$coreWheel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERITRAIL_E3_ASSETS=$assetRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run E3 release clean-install acceptance
        run: >-
          python scripts/entry_layer_e3_acceptance.py
          --output "${{ runner.temp }}\entry-layer-e3-readback"
          --python "${{ steps.py310.outputs.python-path }}"
          --python "${{ steps.py313.outputs.python-path }}"
          --core-wheel "${{ env.VERITRAIL_CORE_WHEEL_E3 }}"
          --from-assets "${{ env.VERITRAIL_E3_ASSETS }}"

  workbench:
    name: Workbench tests, lint, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Workbench dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Run Workbench regression tests
        run: npm test

      - name: Lint Workbench sources
        run: npm run lint

      - name: Type-check and build Workbench
        run: npm run build

      - name: Audit Workbench dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org

  starter-golden-path:
    name: Starter PASS/FAIL golden path
    needs: [python, workbench]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            starter/pyproject.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Core, Starter, and Chromium
        run: |
          python -m pip install --editable ".[browser,command-windows]"
          python -m pip install --editable ./starter
          python -m playwright install chromium

      - name: Build the production Workbench
        working-directory: web
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run build

      - name: Run the real Starter PASS/FAIL chain
        run: >-
          python scripts/starter_single_webapp_acceptance.py
          --output "${{ runner.temp }}\starter-single-webapp-s1"

      - name: Upload failed Starter acceptance evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: starter-single-webapp-s1-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\starter-single-webapp-s1
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
