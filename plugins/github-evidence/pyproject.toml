[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "veritrail-github-evidence"
version = "0.1.0"
description = "Read-only GitHub REST evidence collector for VeriTrail AcceptancePlan 0.1"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "NoctilumeDev" },
]
dependencies = ["veritrail==0.12.2"]

[project.scripts]
veritrail-github-collect = "veritrail_github.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
